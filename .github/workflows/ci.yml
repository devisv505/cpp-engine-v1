name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            bindir: build/Release
            exe: .exe
          - os: ubuntu-latest
            artifact: linux-x64
            bindir: build
            exe: ''
          - os: macos-latest
            artifact: macos-arm64
            bindir: build
            exe: ''
    steps:
      - uses: actions/checkout@v4

      # SDL builds from source in CI; it needs the platform video/audio dev
      # headers on Linux, plus Vulkan for our renderer backend.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libvulkan-dev glslang-tools \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev \
            libdecor-0-dev wayland-protocols

      - name: Cache SDL build
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-sdl-3.4.12-static

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENGINE_FETCH_SDL=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Runs before Package so a red test also blocks artifacts and releases.
      # The tests are headless (no window, no SDL_Init), so no display needed.
      # -C Release selects the config on the Windows multi-config generator;
      # the single-config Linux/macOS builds ignore it.
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          STAGE="engine505-${VERSION}-${{ matrix.artifact }}"
          mkdir "$STAGE"
          cp "${{ matrix.bindir }}/engine${{ matrix.exe }}" "$STAGE/"
          # Package the runtime data exactly as the build staged it next to the
          # binary (config, scripts, and on Linux the compiled SPIR-V shaders).
          for data in config scripts shaders; do
            if [ -d "${{ matrix.bindir }}/$data" ]; then
              cp -R "${{ matrix.bindir }}/$data" "$STAGE/"
            fi
          done
          cp README.md LICENSE "$STAGE/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$STAGE.zip" "$STAGE"
            echo "ARCHIVE=$STAGE.zip" >> "$GITHUB_ENV"
          else
            tar czf "$STAGE.tar.gz" "$STAGE"
            echo "ARCHIVE=$STAGE.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Engine505 $GITHUB_REF_NAME" \
            --generate-notes
